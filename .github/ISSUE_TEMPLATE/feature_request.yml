name: ✨ Feature request
description: Suggest a new tool or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you'd like to ask your assistant to do, or what's missing today.
      placeholder: e.g. "I'd like to change my heating schedule from the chat, not just read it."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: New tool(s), arguments or behaviour. Hive's API isn't documented, so if you know the request the Hive app or pyhiveapi makes for this (path and JSON body, with private details removed), include it. It's often most of the work.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this
